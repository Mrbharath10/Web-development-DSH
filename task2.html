<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            background-color: rgb(78, 108, 148);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 20px;
        }

        .form-container {
            background-color: rgb(199, 182, 182);
            padding: 25px;
            border: 2px solid #333;
            border-radius: 6px;
            width: 480px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Student Registration Form</h2>

    <div class="form-container">
        <form>
            <table>
                <tr>
                    <td>Student Name:</td>
                    <td><input type="text" placeholder="Enter your name"></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email" placeholder="Enter your email"></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" placeholder="Enter password"></td>
                </tr>
                <tr>
                    <td>Phone Number:</td>
                    <td><input type="text" placeholder="Enter phone number"></td>
                </tr>
                <tr>
                    <td>Date of Birth:</td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" id="male"> <label for="male">Male</label>
                        <input type="radio" name="gender" id="female"> <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td>Department:</td>
                    <td>
                        <select>
                            <option>Select Department</option>
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>Mech</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Address:</td>
                    <td><textarea rows="3" placeholder="Enter your address"></textarea></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="checkbox" id="terms"> <label for="terms">I agree to the terms and conditions.</label>
                    </td>
                </tr>
            </table>

            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset">Clear</button>
            </div>
        </form>
    </div>

</body>
</html>
